<style>
:root{--b1:#eef6ff;--b2:#c9e0f8;--ink:#12324f;--mut:#48688a;--card:rgba(255,255,255,.82);--br:#b5d1ee;--ac:#2f7bd0;--ac2:#1d4f92;--d1:#5b8fd0;--d2:#2f5f9e;--cl:.6;--hn:#8a5a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#0c1f35;--b2:#123a63;--ink:#e7f1fc;--mut:#9fbedd;--card:rgba(17,44,74,.85);--br:#2b5079;--ac:#4a94e6;--ac2:#9cc8f7;--d1:#2c5a91;--d2:#183b66;--cl:.1;--hn:#f2c66d}}
:root[data-theme="dark"]{--b1:#0c1f35;--b2:#123a63;--ink:#e7f1fc;--mut:#9fbedd;--card:rgba(17,44,74,.85);--br:#2b5079;--ac:#4a94e6;--ac2:#9cc8f7;--d1:#2c5a91;--d2:#183b66;--cl:.1;--hn:#f2c66d}

*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--b1) linear-gradient(var(--b1),var(--b2)) fixed;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:.2em 0}
.cl{position:fixed;height:44px;background:#fff;border-radius:50px;opacity:var(--cl);animation:dr 80s linear infinite;pointer-events:none}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl:before{width:50%;height:150%;left:14%;top:-70%}.cl:after{width:36%;height:120%;right:12%;top:-45%}
@keyframes dr{from{transform:translateX(-40vw)}to{transform:translateX(130vw)}}

main{position:relative;max-width:640px;margin:0 auto;padding:18px 16px 56px}
.card{background:var(--card);border:1px solid var(--br);border-radius:20px;padding:16px 18px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border-radius:999px;padding:13px 24px;font-weight:600;display:block;margin:16px auto}

input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--br);border-radius:12px;padding:10px 12px;margin-top:6px}
.mut{color:var(--mut)}

.cd{aspect-ratio:1;border-radius:12px;background:rgba(120,170,230,.16);border:1px solid var(--br);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.15}

.cd.nov{border-style:dashed;border-color:var(--ac2)}
.bar{height:8px;border-radius:9px;background:rgba(120,170,230,.25);overflow:hidden}

.med{display:inline-flex;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#a9d0f7 60%,#5b9bdc);border:3px solid #fff;box-shadow:0 4px 14px rgba(30,80,140,.35);align-items:center;justify-content:center;font-size:26px;position:relative}
.med i{font-style:normal;position:absolute;right:-8px;bottom:-4px;font-size:22px}
.med.s{width:20px;height:20px;font-size:10px;border-width:1px;box-shadow:none}.med.s i{font-size:9px;right:-4px;bottom:-3px}
.pop{animation:pop .7s}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.door{margin:18px auto;width:min(270px,82%);min-height:260px;border-radius:135px 135px 10px 10px;background:linear-gradient(160deg,var(--d1),var(--d2));border:6px solid #fff;box-shadow:0 8px 24px rgba(20,60,110,.3);display:flex;align-items:center;justify-content:center;padding:46px 24px 26px;text-align:center;color:#fff;font:italic 20px/1.35 Georgia,serif;position:relative;transition:transform .8s,opacity .8s}
.door:after{content:"";position:absolute;right:18px;top:56%;width:12px;height:12px;border-radius:50%;background:#ffe9a8}
.door.o{transform:perspective(600px) rotateY(-16deg);opacity:.8}
.tag{display:inline-block;border-radius:999px;border:1px dashed var(--ac2);padding:2px 12px;font-size:14px}
dialog{border:1px solid var(--br);border-radius:20px;background:var(--b1);color:var(--ink);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,30,60,.5)}
.hn{font:italic 18px/1.4 Georgia,serif;color:var(--hn);margin:10px 8px 0}
.pb{display:flex;flex-direction:column;gap:10px}
.btn2{border:1.5px solid var(--ac);color:var(--ac2);border-radius:999px;padding:12px 18px;font-weight:600;background:rgba(120,170,230,.12)}
dialog{max-height:88vh;overflow:auto}
.door.s{width:100%;min-height:0;border-radius:18px;padding:16px 20px;font-size:18px;margin:12px 0;border-width:3px}
.door.s:after{display:none}
details summary{cursor:pointer;font:600 18px Georgia,serif}
details[open] summary{margin-bottom:8px}
@media print{.cl,button,.noprint{display:none!important}body{background:#fff;color:#000}.card{background:#fff;break-inside:avoid}}

<script>
const ORA=`Señor Jesús hoy te entrego una vez más mi corazón, para que seas tú quien lo moldee, lo transforme y pueda ser semejante al tuyo, hoy de nuevo quiero entregarte nuestro próximo Retiro y cada una de las llaves que servirá y de las puertas que irán a ese encuentro contigo.

Padre amado acógenos en este camino de preparación, permite que tú seas quien nos guíe en cada uno de nuestros roles, permite que tengamos el corazón dispuesto y abierto a acompañar, escuchar y servir.

Hoy te pido que fortalezcas cada una de mis virtudes y la de todas nuestras llaves, que seas tú quien fortalezca los dones que tú mismo como Espíritu Santo has de concedernos para hacernos cada vez mejores llaves que traigan a nuevas puertas a un encuentro especial contigo.

Señor Jesús hoy te pido por cada una de las puertas y sus peticiones al hacer este retiro para que los colmes de paciencia en el proceso, entendimiento y aceptación de tu voluntad y sobre todo para que estén abiertos a sentir tu amor sin importar los caminos que has dispuesto en sus vidas.

Te entrego en este momento mi corazón, de aquí en adelante que seas tú quien obre a través de mí en este camino de preparación y en ese fin de semana con un SÍ absoluto a ti.

Cúbrenos con tu preciosísima sangre y guíanos a las personas que tú quieres que lleguemos, sella nuestro Retiro y ayúdanos a que en esa fecha tan importante en que sabemos que el enemigo se vale de muchas cosas para hacer el mal especialmente en esta noche del 31 de octubre tengamos fortaleza en nuestra oración para contrarrestar cualquier intención negativa y ser solo herramientas tuyas para seguir llevando más almas a ti. Que todo el fin de semana y todo el retiro se dé para tu gracia y según tu voluntad.

Gracias señor por escucharme, por recibirme y por llamarme. Amén`;
const ISG=`Toma, Señor, y recibe toda mi libertad,
mi memoria, mi entendimiento
y toda mi voluntad;
todo mi haber y mi poseer.
Tú me lo diste, a Ti, Señor, lo retorno.
Todo es Tuyo: dispón de ello según Tu Voluntad.
Dame Tu Amor y Gracia,
que éstas me bastan. Amén`;
const SEM=["Sabiduría","Entendimiento","Ciencia","Consejo","Fortaleza","Piedad","Temor de Dios"];
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DON={"Sabiduría":"Gracia de poder ver cada cosa con los ojos de Dios.","Entendimiento":"Comprender con el corazón las verdades de la fe y la Palabra.","Ciencia":"Ver la creación y nuestra propia vida como obra de Dios.","Consejo":"Discernir y elegir bien, y guiar a otros con prudencia.","Fortaleza":"Superar los miedos, obstáculos y situaciones difíciles estando cerquita de Él.","Piedad":"Amor filial a Dios y unión con los demás.","Temor de Dios":"No es temerle: es reconocer nuestra pequeñez y la majestuosa grandeza de Dios."};
const PH="Hoy voy a nacer de nuevo y transformar mi corazón";
const IG=["San Ignacio nació en 1491 en Loyola, España, en una familia noble y numerosa. Fue el menor de 13 hermanos.", "Antes de ser santo, soñaba con ser un gran caballero. Le atraían las armas, las aventuras, el honor y el reconocimiento.", "No comenzó su vida pensando en ser sacerdote ni religioso. Su historia nos recuerda que Dios puede llamar a una persona desde caminos completamente inesperados.", "A los 30 años fue gravemente herido en la batalla de Pamplona. Una bala de cañón destrozó su pierna y lo obligó a permanecer durante meses en recuperación.", "Durante su convalecencia pidió libros de caballería, pero en el castillo solo encontraron para él libros sobre la vida de Cristo y de los santos.", "Al leerlos comenzó a notar algo dentro de él: pensar en la vida de caballero le producía entusiasmo, pero después quedaba vacío; pensar en dedicar su vida a Dios le dejaba una alegría más profunda.", "Esta experiencia fue fundamental para su conversión. Ignacio comenzó a prestar atención a lo que sucedía en su interior y a preguntarse qué lo acercaba realmente a Dios.", "Después de su conversión peregrinó al santuario de Montserrat. Allí pasó una noche entera en oración y dejó su espada como símbolo de la vida que quería abandonar.", "Ignacio no se convirtió de un día para otro en la persona que quería ser. Su camino estuvo lleno de preguntas, luchas, errores y aprendizajes.", "Vivió un tiempo en Manresa, España, dedicado intensamente a la oración. Allí experimentó momentos de profunda alegría, pero también dudas, angustia y dificultades espirituales.", "En Manresa tuvo experiencias espirituales que marcaron profundamente su vida. Más adelante diría que allí aprendió muchas cosas sobre Dios y sobre sí mismo.", "En esa etapa comenzó a escribir lo que posteriormente serían los Ejercicios Espirituales. No nacieron como un libro académico, sino de su propia experiencia de oración y discernimiento.", "Los Ejercicios Espirituales buscan ayudar a una persona a encontrarse personalmente con Dios. No se trata solamente de aprender sobre la fe, sino de dejar que Dios transforme la propia vida.", "Ignacio enseñó a prestar atención a los movimientos del corazón. Se preguntaba qué pensamientos, deseos y experiencias llevaban a una persona hacia Dios y cuáles la alejaban de Él.", "De ahí nace una de sus grandes enseñanzas: el discernimiento. No se trata simplemente de preguntarnos “¿qué quiero?”, sino de descubrir qué camino conduce hacia Dios.", "Ignacio creía que Dios puede encontrarse en lo cotidiano. Por eso una de las ideas centrales de su espiritualidad es “buscar y hallar a Dios en todas las cosas”.", "Estaba convencido de que la oración debía llevar a la acción. Para él, encontrarse con Dios debía transformar la manera en que vivimos, decidimos, amamos y servimos.", "Ignacio estudió siendo ya adulto. En París comenzó nuevamente su formación académica, a pesar de ser mayor que muchos de sus compañeros.", "En París conoció a un grupo de compañeros con quienes compartiría su misión. Entre ellos estaba San Francisco Javier.", "Junto con sus compañeros fundó la Compañía de Jesús en 1540, conocida como los jesuitas.", "Los primeros compañeros de Ignacio querían ponerse al servicio de Dios y de la Iglesia allí donde fueran más necesarios. Su espiritualidad tenía una fuerte dimensión misionera.", "San Ignacio difundió de manera muy importante la oración “Alma de Cristo”. La oración existía antes de él y no fue escrita por Ignacio, pero él la incorporó a los Ejercicios Espirituales y contribuyó a que se difundiera ampliamente.", "“Alma de Cristo” expresa un deseo profundo de unión con Jesús. Comienza diciendo: “Alma de Cristo, santifícame”, y continúa pidiendo ser salvado, lavado, fortalecido y unido a Él.", "Ignacio recomendaba revisar diariamente la propia vida delante de Dios, en lo que conocemos como el Examen: reconocer aquello por lo que agradecemos, descubrir dónde estuvo Dios y mirar qué necesitamos cambiar.", "Para Ignacio, la vida espiritual no consistía en ser perfecto, sino en aprender a caminar con Dios. La conversión es un proceso que continúa durante toda la vida.", "Una de sus grandes aspiraciones quedó resumida en una frase: “En todo amar y servir.” Para Ignacio, el amor a Dios debía hacerse concreto en el servicio a los demás.", "Otra expresión profundamente ignaciana es “para mayor gloria de Dios”. Ignacio quería que sus decisiones, talentos y acciones estuvieran orientados a algo más grande que el propio reconocimiento.", "Ignacio murió en Roma el 31 de julio de 1556. La Iglesia lo canonizó en 1622 junto con otros grandes santos como San Francisco Javier y Santa Teresa de Jesús.", "San Ignacio puede acompañar especialmente este retiro porque su propia vida fue un camino de búsqueda. Pasó de buscar gloria y reconocimiento a querer conocer a Jesús, discernir su voluntad, encontrarlo en todas las cosas y poner su vida al servicio de los demás."];
const DOC=[{"c": "Lucas 10, 1-12", "e": ["En aquel tiempo, designó el Señor a otros setenta y dos discípulos y los mandó por delante, de dos en dos, a todos los pueblos y lugares a donde pensaba ir, y les dijo: “La cosecha es mucha y los trabajadores pocos. Rueguen, por lo tanto, al dueño de la mies que envíe trabajadores a sus campos. Pónganse en camino; los envío como corderos en medio de lobos. No lleven ni dinero, ni morral, ni sandalias y no se detengan a saludar a nadie por el camino. Cuando entren en una casa, digan: ‘Que la paz reine en esta casa’. Y si allí hay gente amante de la paz, el deseo de paz de ustedes se cumplirá; si no, no se cumplirá. Quédense en esa casa. Coman y beban de lo que tengan, porque el trabajador tiene derecho a su salario. No anden de casa en casa. En cualquier ciudad donde entren y los reciban, coman lo que les den. Curen a los enfermos que haya y díganles: ‘Ya se acerca a ustedes el Reino de Dios’.", "Pero si entran en una ciudad y no los reciben, salgan por las calles y digan: ‘Hasta el polvo de esta ciudad que se nos ha pegado a los pies nos lo sacudimos, en señal de protesta contra ustedes. De todos modos, sepan que el Reino de Dios está cerca’. Yo les digo que en el día del juicio, Sodoma será tratada con menos rigor que esa ciudad”."], "n": "Fortaleza", "d": "para superar los miedos, obstáculos y situaciones difíciles estando cerquita de él", "o": "Señor en este camino dame fortaleza para sobrellevar las situaciones que pueda presentar y ayúdame a ser esa llave para ayudarte a preparar tu camino para las puertas que irán a tu encuentro. San Ignacio de Loyola, ruega por nosotros.", "r": ["Cuéntanos qué miedo que puedas tener al asumir este rol, deseas entregarle a Dios el día de hoy y en el cual deseas que te dé fortaleza para sobrellevarlo."]}, {"c": "Mateo 18, 1-5. 10", "e": ["En cierta ocasión, los discípulos se acercaron a Jesús y le preguntaron: \"¿Quién es más grande en el Reino de los cielos?\"", "Jesús llamó a un niño, lo puso en medio de ellos y les dijo: \"Yo les aseguro a ustedes que, si no cambian y no se hacen como los niños, no entrarán en el Reino de los cielos. Así pues, quien se haga pequeño como este niño, ése es el más grande en el Reino de los cielos. Y el que reciba a un niño como éste en mi nombre, me recibe a mí.", "Cuidado con despreciar a uno de estos pequeños, pues yo les digo que sus ángeles, en el cielo, ven continuamente el rostro de mi Padre, que está en el cielo\"."], "n": "Piedad", "d": "Amor filial a Dios y unión con los demás", "o": "Señor te pido que fortalezcas en mi la piedad para volver a ser como un niño evitando juicios y comparaciones en mi día a día y que en mi camino como Llave pueda ver en otros el rostro de nuestro padre. San Ignacio de Loyola, ruega por nosotros.", "r": ["Piensa en una persona a la que hayas juzgado o con la que te cueste relacionarte, y eleva una pequeña oración por él o ella, su bienestar y di: Señor ayúdame a ver menos a esta persona con ojos de juez y más con corazón de amor."]}, {"c": "Lucas 10, 17-24", "e": ["En aquel tiempo, los setenta y dos discípulos regresaron llenos de alegría y le dijeron a Jesús: “Señor, hasta los demonios se nos someten en tu nombre”.", "Él les contestó: “Vi a Satanás caer del cielo como el rayo. A ustedes les he dado poder para aplastar serpientes y escorpiones y para vencer toda la fuerza del enemigo, y nada les podrá hacer daño. Pero no se alegren de que los demonios se les sometan. Alégrense más bien de que sus nombres están escritos en el cielo”.", "En aquella misma hora, Jesús se llenó de júbilo en el Espíritu Santo y exclamó: “¡Te doy gracias, Padre, Señor del cielo y de la tierra, porque has escondido estas cosas a los sabios y a los entendidos, y las has revelado a la gente sencilla! ¡Gracias, Padre, porque así te ha parecido bien! Todo me lo ha entregado mi Padre y nadie conoce quién es el Hijo, sino el Padre; ni quién es el Padre, sino el Hijo y aquel a quien el Hijo se lo quiera revelar”.", "Volviéndose a sus discípulos, les dijo aparte: “Dichosos los ojos que ven lo que ustedes ven. Porque yo les digo que muchos profetas y reyes quisieron ver lo que ustedes ven y no lo vieron, y oír lo que ustedes oyen y no lo oyeron”."], "n": "Temor de Dios", "d": "No es temerle, es reconocer nuestra pequeñez y la majestuosa grandeza de Dios.", "o": "Gracias Padre amado por llamarme a esta misión como llave, permíteme dentro de mi pequeñez seguir reconociendo tu grandeza. Gracias por amarme y por elegirme aún cuando cometo errores, pon un poquito de miel en mi oración y en esta preparación para no dejarla. Tomad, Señor, y recibid, San Ignacio de Loyola, ruega por nosotros.", "r": ["Tomate un momento de silencio y solo imagínate ahí recibiendo un abrazo de Jesús."]}, {"c": "Mateo 21, 33-43", "e": ["En aquel tiempo, Jesús dijo a los sumos sacerdotes y a los ancianos del pueblo esta parábola: \"Había una vez un propietario que plantó un viñedo, lo rodeó con una cerca, cavó un lagar en él, construyó una torre para el vigilante y luego lo alquiló a unos viñadores y se fue de viaje.", "Llegado el tiempo de la vendimia, envió a sus criados para pedir su parte de los frutos a los viñadores; pero éstos se apoderaron de los criados, golpearon a uno, mataron a otro y a otro más lo apedrearon. Envió de nuevo a otros criados, en mayor número que los primeros, y los trataron del mismo modo.", "Por último, les mandó a su propio hijo, pensando: 'A mi hijo lo respetarán'. Pero cuando los viñadores lo vieron, se dijeron unos a otros: 'Éste es el heredero. Vamos a matarlo y nos quedaremos con su herencia'. Le echaron mano, lo sacaron del viñedo y lo mataron.", "Ahora, díganme: cuando vuelva el dueño del viñedo, ¿qué hará con esos viñadores?\" Ellos le respondieron: \"Dará muerte terrible a esos desalmados y arrendará el viñedo a otros viñadores, que le entreguen los frutos a su tiempo\".", "Entonces Jesús les dijo: \"¿No han leído nunca en la Escritura: La piedra que desecharon los constructores, es ahora la piedra angular. Esto es obra del Señor y es un prodigio admirable?", "Por esta razón les digo que les será quitado a ustedes el Reino de Dios y se le dará a un pueblo que produzca sus frutos\"."], "n": "Sabiduría", "d": "gracia de poder ver cada cosa con los ojos de Dios", "o": "Señor fortalece en mi el don de la Sabiduría para discernir en las situaciones que se me presenten y no desviarme del camino que has dispuesto para rendir los frutos que me has encomendado en esta misión. San Ignacio de Loyola, ruega por nosotros.", "r": ["En esa decisión, miedo o petición que estás poniendo en manos de Dios considera si te está llevando a los frutos dispuestos por él o si te puede estar aumentando solo tu beneficio propio y alejándote de la justicia."]}, {"c": "Lucas 10, 25-37", "e": ["En aquel tiempo, se presentó ante Jesús un doctor de la ley para ponerlo a prueba y le preguntó: “Maestro, ¿qué debo hacer para conseguir la vida eterna?” Jesús le dijo: “¿Qué es lo que está escrito en la ley? ¿Qué lees en ella?” El doctor de la ley contestó: “Amarás al Señor tu Dios, con todo tu corazón, con toda tu alma, con todas tus fuerzas y con todo tu ser, y a tu prójimo como a ti mismo”. Jesús le dijo: “Has contestado bien; si haces eso, vivirás”.", "El doctor de la ley, para justificarse, le preguntó a Jesús: “¿Y quién es mi prójimo?” Jesús le dijo: “Un hombre que bajaba por el camino de Jerusalén a Jericó, cayó en manos de unos ladrones, los cuales lo robaron, lo hirieron y lo dejaron medio muerto. Sucedió que por el mismo camino bajaba un sacerdote, el cual lo vio y pasó de largo. De igual modo, un levita que pasó por ahí, lo vio y siguió adelante. Pero un samaritano que iba de viaje, al verlo, se compadeció de él, se le acercó, ungió sus heridas con aceite y vino y se las vendó; luego lo puso sobre su cabalgadura, lo llevó a un mesón y cuidó de él. Al día siguiente sacó dos denarios, se los dio al dueño del mesón y le dijo: ‘Cuida de él y lo que gastes de más, te lo pagaré a mi regreso’.", "¿Cuál de estos tres te parece que se portó como prójimo del hombre que fue asaltado por los ladrones?’’ El doctor de la ley le respondió: “El que tuvo compasión de él”. Entonces Jesús le dijo: “Anda y haz tú lo mismo”."], "n": "Entendimiento", "d": "", "o": "Señor fortalece en mi el entendimiento para que pueda escuchar tu palabra, para que no desvíe aquello que quieres decirme y en este camino de preparación pueda escuchar ver en el prójimo tu amor.", "r": ["Haz un acto de caridad por alguien que puede ser de tu familia, amigos, trabajo o un desconocido"]}, {"c": "Lucas 10, 38-42", "e": ["En aquel tiempo, entró Jesús en un poblado, y una mujer, llamada Marta, lo recibió en su casa. Ella tenía una hermana, llamada María, la cual se sentó a los pies de Jesús y se puso a escuchar su palabra. Marta, entre tanto, se afanaba en diversos quehaceres, hasta que, acercándose a Jesús, le dijo: “Señor, ¿no te has dado cuenta de que mi hermana me ha dejado sola con todo el quehacer? Dile que me ayude”.", "El Señor le respondió: “Marta, Marta, muchas cosas te preocupan y te inquietan, siendo así que una sola es necesaria. María escogió la mejor parte y nadie se la quitará”."], "n": "Ciencia", "d": "", "o": "Señor fortalece en mi el Don de la ciencia y ayúdame a no distraerme por aquellas cosas que me inquietan en el afán del día sino que en lo más pequeño te vea y te escuche.", "r": ["Para un momento dentro del corre corre del día y recuerda hoy Dios a través de que te habló"]}, {"c": "Lucas 1, 26-38", "e": ["En aquel tiempo, el ángel Gabriel fue enviado por Dios a una ciudad de Galilea, llamada Nazaret, a una virgen desposada con un varón de la estirpe de David, llamado José. La virgen se llamaba María.", "Entró el ángel a donde ella estaba y le dijo: “Alégrate, llena de gracia, el Señor está contigo”. Al oír estas palabras, ella se preocupó mucho y se preguntaba qué querría decir semejante saludo.", "El ángel le dijo: “No temas, María, porque has hallado gracia ante Dios. Vas a concebir y a dar a luz un hijo y le pondrás por nombre Jesús. Él será grande y será llamado Hijo del Altísimo; el Señor Dios le dará el trono de David, su padre, y él reinará sobre la casa de Jacob por los siglos y su reinado no tendrá fin”.", "María le dijo entonces al ángel: “¿Cómo podrá ser esto, puesto que yo permanezco virgen?” El ángel le contestó: “El Espíritu Santo descenderá sobre ti y el poder del Altísimo te cubrirá con su sombra. Por eso, el Santo, que va a nacer de ti, será llamado Hijo de Dios. Ahí tienes a tu parienta Isabel, que, a pesar de su vejez, ha concebido un hijo y ya va en el sexto mes la que llamaban estéril, porque no hay nada imposible para Dios”. María contestó: “Yo soy la esclava del Señor; cúmplase en mí lo que me has dicho”. Y el ángel se retiró de su presencia."], "n": "Consejo", "d": "", "o": "Padre ayúdame a ser prudente y obediente en la misión que me has encomendado en este retiro, guíame para que así como tu madre pueda decir yo soy tu esclavo, cúmplase en mi lo que has dicho y abrace tu voluntad en las situaciones que atravieso. San Ignacio de Loyola, ruega por nosotros", "r": ["¿Qué consejo le darías a alguien para ayudarlo a aceptar la voluntad de Dios?"]}, {"c": "Lucas 11, 5-13", "e": ["En aquel tiempo, Jesús dijo a sus discípulos: “Supongan que alguno de ustedes tiene un amigo que viene a medianoche a decirle: ‘Préstame, por favor, tres panes, pues un amigo mío ha venido de viaje y no tengo nada que ofrecerle’. Pero él le responde desde dentro: ‘No me molestes. No puedo levantarme a dártelos, porque la puerta ya está cerrada y mis hijos y yo estamos acostados’. Si el otro sigue tocando, yo les aseguro que, aunque no se levante a dárselos por ser su amigo, sin embargo, por su molesta insistencia, sí se levantará y le dará cuanto necesite.", "Así también les digo a ustedes: Pidan y se les dará, busquen y encontrarán, toquen y se les abrirá. Porque quien pide, recibe; quien busca, encuentra y al que toca, se le abre. ¿Habrá entre ustedes algún padre que, cuando su hijo le pida pan, le dé una piedra? ¿O cuando le pida pescado, le dé una víbora? ¿O cuando le pida huevo, le dé un alacrán?", "Pues, si ustedes, que son malos, saben dar cosas buenas a sus hijos, ¿cuánto más el Padre celestial les dará el Espíritu Santo a quienes se lo pidan?’’"], "n": "Fortaleza", "d": "", "o": "Espíritu Santo ayúdame para que en las situaciones que estoy atravesando no desfallezca y en cambio sea un imán para seguir buscando de ti, dame fortaleza en los anhelos de mi corazón. San Ignacio de Loyola, ruega por nosotros.", "r": ["¿Recuerdas eso que has pensado “Ya me estoy cansado de pedirlo porque no sucede”? Pídeselo una vez más el día de hoy pero si tocas esta puerta recuerda que no siempre se abrirá como tu lo esperas"]}, {"c": "Lucas 11, 15-26", "e": ["En aquel tiempo, cuando Jesús expulsó a un demonio, algunos dijeron: “Éste expulsa a los demonios con el poder de Satanás, el príncipe de los demonios”. Otros, para ponerlo a prueba, le pedían una señal milagrosa.", "Pero Jesús, que conocía sus malas intenciones, les dijo: ‘’Todo reino dividido por luchas internas va a la ruina y se derrumba casa por casa. Si Satanás también está dividido contra sí mismo, ¿cómo mantendrá su reino? Ustedes dicen que yo arrojo a los demonios con el poder de Satanás. Entonces, ¿con el poder de quién los arrojan los hijos de ustedes? Por eso, ellos mismos serán sus jueces. Pero si yo arrojo a los demonios por el poder de Dios, eso significa que ha llegado a ustedes el Reino de Dios.", "Cuando un hombre fuerte y bien armado guarda su palacio, sus bienes están seguros; pero si otro más fuerte lo asalta y lo vence, entonces le quita las armas en que confiaba y después dispone de sus bienes. El que no está conmigo, está contra mí; y el que no recoge conmigo, desparrama.", "Cuando el espíritu inmundo sale de un hombre, anda vagando por lugares áridos, en busca de reposo, y al no hallarlo, dice: ‘Volveré a mi casa, de donde salí’. Y al llegar, la encuentra barrida y arreglada. Entonces va por otros siete espíritus peores que él y vienen a instalarse allí, y así la situación final de aquel hombre resulta peor que la de antes”."], "n": "Piedad", "d": "", "o": "Señor Jesús te entrego mi corazón para que en este camino de preparación me orientes a la unión y disipes las divisiones que pueda tener con otros o contigo, sigue renovando con este Don, mi amor hacia a ti y la armonía con otros. San Ignacio de Loyola, ruega por Nosotros.", "r": ["Imagínate (aunque parezca difícil) haciendo las paces con la última pelea que tuviste con Dios, tan pequeña o tan grande como parezca."]}, {"c": "Lucas 11, 27-28", "e": ["En aquel tiempo, mientras Jesús hablaba a la multitud, una mujer del pueblo, gritando, le dijo: “¡Dichosa la mujer que te llevó en su seno y cuyos pechos te amamantaron!” Pero Jesús le respondió: “Dichosos todavía más los que escuchan la palabra de Dios y la ponen en práctica”."], "n": "Temor de Dios", "d": "", "o": "Espíritu Santo guíame y acompáñame para que nunca pierda el temor de ti y pueda seguir tu ejemplo, reconocer que en mi pequeña humanidad puedo errar pero que en estos errores también vea tu grandeza y misericordia y me animen a ser semejante a ti. San Ignacio de Loyola, ruega por nosotros", "r": ["Llevamos 10 días de esta preparación, ofrece un denario a la virgen maría el día de hoy por lo que Dios te ha estado comunicando a través de su palabra."]}, {"c": "Mateo 22, 1-10", "e": ["En aquel tiempo, volvió Jesús a hablar en parábolas a los sumos sacerdotes y a los ancianos del pueblo, diciendo: \"El Reino de los cielos es semejante a un rey que preparó un banquete de bodas para su hijo. Mandó a sus criados que llamaran a los invitados, pero éstos no quisieron ir.", "Envió de nuevo a otros criados que les dijeran: 'Tengo preparado el banquete; he hecho matar mis terneras y los otros animales gordos; todo está listo. Vengan a la boda'. Pero los invitados no hicieron caso. Uno se fue a su campo, otro a su negocio y los demás se les echaron encima a los criados, los insultaron y los mataron.", "Entonces el rey se llenó de cólera y mandó sus tropas, que dieron muerte a aquellos asesinos y prendieron fuego a la ciudad.", "Luego les dijo a sus criados: 'La boda está preparada; pero los que habían sido invitados no fueron dignos. Salgan, pues, a los cruces de los caminos y conviden al banquete de bodas a todos los que encuentren'. Los criados salieron a los caminos y reunieron a todos los que encontraron, malos y buenos, y la sala del banquete se llenó de convidados."], "n": "Sabiduría", "d": "", "o": "Padre amado dame sabiduría para recibir este camino al que me has llamado con este servicio, ayúdame a evitar ser esa persona que no atiende al banquete que has preparado para mi y guíame a ser aquel criado que lleve a estas nuevas puertas a tu encuentro.", "r": ["No olvides que tu Padre ha preparado un banquete especial para ti y te está esperando en la Eucaristía. ¡No Faltes! … Y no olvides encomendar nuestro retiro, a nuestra llaves y a nuestras puertas."]}, {"c": "Lucas 11, 29-32", "e": ["En aquel tiempo, la multitud se apiñaba alrededor de Jesús y éste comenzó a decirles: “La gente de este tiempo es una gente perversa. Pide una señal, pero no se le dará más señal que la de Jonás. Pues así como Jonás fue una señal para los habitantes de Nínive, lo mismo será el Hijo del hombre para la gente de este tiempo.", "Cuando sean juzgados los hombres de este tiempo, la reina del sur se levantará el día del juicio para condenarlos, porque ella vino desde los últimos rincones de la tierra para escuchar la sabiduría de Salomón, y aquí hay uno que es más que Salomón.", "Cuando sea juzgada la gente de este tiempo, los hombres de Nínive se levantarán el día del juicio para condenarla, porque ellos se convirtieron con la predicación de Jonás, y aquí hay uno que es más que Jonás’’."], "n": "Entendimiento", "d": "", "o": "Señor Jesús ayúdame a abrir mi corazón esta semana para seguir tu palabra, para llegar a donde sea necesario para seguirte y que en este camino de servicio busque siempre mi conversión en ti señor. San Ignacio de Loyola, ruega por nosotros", "r": ["Iniciando la semana elige una mortificación que quieras realizar por hoy (Ejemplo, el minuto heroico el día de mañana, no comer dulce, renunciar a algo rico del día, renunciar al celular en un espacio que siempre lo utilices… etc)"]}, {"c": "Lucas 11, 37-41", "e": ["En aquel tiempo, un fariseo invitó a Jesús a comer. Jesús fue a la casa del fariseo y se sentó a la mesa. El fariseo se extrañó de que Jesús no hubiera cumplido con la ceremonia de lavarse las manos antes de comer.", "Pero el Señor le dijo: “Ustedes, los fariseos, limpian el exterior del vaso y del plato; en cambio, el interior de ustedes está lleno de robos y maldad. ¡Insensatos! ¿Acaso el que hizo lo exterior no hizo también lo interior? Den más bien limosna de lo que tienen y todo lo de ustedes quedará limpio”."], "n": "Ciencia", "d": "", "o": "Padre amado, que yo como llave a través de poder contemplar cada una de las cosas que tú me has brindado limpie mi interior, permíteme en este camino de preparación identificar que debo seguir limpiando en mi para llegar lo más limpio al servicio de las puertas que van a encontrarse contigo. San Ignacio de Loyola", "r": ["¿Que crees que Dios te esta llamando a limpiar en este camino de preparación?"]}, {"c": "Lucas 11, 42-46", "e": ["En aquel tiempo, Jesús dijo: “¡Ay de ustedes, fariseos, porque pagan diezmos hasta de la hierbabuena, de la ruda y de todas las verduras, pero se olvidan de la justicia y del amor de Dios! Esto debían practicar sin descuidar aquello. ¡Ay de ustedes, fariseos, porque les gusta ocupar los lugares de honor en las sinagogas y que les hagan reverencias en las plazas! ¡Ay de ustedes, porque son como esos sepulcros que no se ven, sobre los cuales pasa la gente sin darse cuenta!”", "Entonces tomó la palabra un doctor de la ley y le dijo: “Maestro, al hablar así, nos insultas también a nosotros”. Entonces Jesús le respondió: “¡Ay de ustedes también, doctores de la ley, porque abruman a la gente con cargas insoportables, pero ustedes no las tocan ni con la punta del dedo!”"], "n": "Consejo", "d": "", "o": "Señor hoy te pido perdón por todas las veces que he podido ser como los fariseos, hazme justo, prudente y del deseo de ser honrado y aplaudido líbrame, señor, que en el rol que estoy teniendo todo sea para gracia tuya y líbrame del deseo de reconocimiento en él. San Ignacio de Loyola, ruega por nosotros.", "r": ["Ofrécele hoy a Dios algo en lo que estés trabajando (un proyecto, tu rol en el retiro, un detalle…) para que sea para su gloria y pídele el deseo de no ser reconocido por ello."]}, {"c": "Lucas 11, 47-54", "e": ["En aquel tiempo, Jesús dijo a los fariseos y doctores de la ley: “¡Ay de ustedes, que les construyen sepulcros a los profetas que los padres de ustedes asesinaron! Con eso dan a entender que están de acuerdo con lo que sus padres hicieron, pues ellos los mataron y ustedes les construyen el sepulcro.", "Por eso dijo la sabiduría de Dios: Yo les mandaré profetas y apóstoles, y los matarán y los perseguirán, para que así se le pida cuentas a esta generación de la sangre de todos los profetas que ha sido derramada desde la creación del mundo, desde la sangre de Abel hasta la de Zacarías, que fue asesinado entre el atrio y el altar. Sí, se lo repito: a esta generación se le pedirán cuentas.", "¡Ay de ustedes, doctores de la ley, porque han guardado la llave de la puerta del saber! Ustedes no han entrado, y a los que iban a entrar les han cerrado el paso’’.", "Luego que Jesús salió de allí, los escribas y fariseos comenzaron a acosarlo terriblemente con muchas preguntas y a ponerle trampas para ver si podían acusarlo con alguna de sus propias palabras."], "n": "Fortaleza", "d": "", "o": "Señor gracias por siempre darme la oportunidad de volver a ti, de vivir en esta generación, en este retiro, con estas llaves y con estas puertas, gracias por llamarme, gracias por oírme, gracias por buscarme y sobre todo gracias por amarme. Permite que siempre permanezca mi fe en ti, permite que este camino de preparación de fortaleza a mi fe y me lleve a vivir mi Cielo en la tierra para caminar contigo hacia la Santidad. San Ignacio de Loyola, ruega por nosotros.", "r": ["¿Recuerdas la llave que te fue asignada en oración? Eleva una oración para que Dios la guíe en el Don de la fortaleza y que en este camino no caiga en fomentar o aprobar nada en otros que la aleje de su propia fe"]}, {"c": "Lucas 12, 1-7", "e": ["En aquel tiempo, la multitud rodeaba a Jesús en tan gran número que se atropellaban unos a otros. Entonces Jesús les dijo a sus discípulos:", "“Cuídense de la levadura de los fariseos, es decir de la hipocresía. Porque no hay nada oculto que no llegue a descubrirse, ni nada secreto que no llegue a conocerse. Por eso, todo lo que ustedes hayan dicho en la oscuridad, se dirá a plena luz, y lo que hayan dicho en voz baja y en privado, se proclamará desde las azoteas.", "Yo les digo a ustedes, amigos míos: No teman a aquellos que matan el cuerpo y después ya no pueden hacer nada más. Les voy a decir a quién han de temer: Teman a aquel que, después de darles muerte, los puede arrojar al lugar de castigo. Se lo repito: A él sí tienen que temerlo.", "¿No se venden cinco pajarillos por dos monedas? Sin embargo, ni de uno solo de ellos se olvida Dios; y por lo que a ustedes toca, todos los cabellos de su cabeza están contados. No teman, pues, porque ustedes valen mucho más que todos los pajarillos’’."], "n": "Piedad", "d": "", "o": "Espíritu Santo dame la gracia en esta preparación, de no permitir ceder ante otros, sino que me deje por tu amor, quiero amarte hasta el extremo. Señor te pido me guíes para poner límites, para darme el valor que merezco al ser hija tuya y poder también buscar la justicia para mi desde el amor hacia ti y los demás. San Ignacio de Loyola, ruega por nosotros.", "r": ["El señor de ama, sabe que eres valioso/a ¿Que límites crees que Dios también te llama a tener con otros o contigo mismo/a?"]}, {"c": "Lucas 12, 8-12", "e": ["En aquel tiempo, Jesús dijo a sus discípulos: “Yo les aseguro que a todo aquel que me reconozca abiertamente ante los hombres, lo reconocerá abiertamente el Hijo del hombre ante los ángeles de Dios; pero a aquel que me niegue ante los hombres, yo lo negaré ante los ángeles de Dios.", "A todo aquel que diga una palabra contra el Hijo del hombre, se le perdonará; pero a aquel que blasfeme contra el Espíritu Santo, no se le perdonará.", "Cuando los lleven a las sinagogas y ante los jueces y autoridades, no se preocupen de cómo se van a defender o qué van a decir, porque el Espíritu Santo les enseñará en aquel momento lo que convenga decir’’."], "n": "Temor de Dios", "d": "", "o": "Espíritu Santo acompáñame en este camino, que seas tu quien durante esta preparación y durante el retiro hable y actúe a través de mí, hoy te doy gracias por darme la oportunidad de reconocerte, ayúdame a acompañar a las puertas que estarán en nuestro retiro a también reconocerte ante los hombres y si en algún momento me llego a cuestionar mi fe acompáñame y sostenme para no alejarme de ti y si en algún momento una de las puertas tiene un quebranto en su fe, enséñame las palabras que tu quieres que lleguen a él o ella.", "r": ["Permítete el día de hoy de enviar un pequeño mensaje a quien crees que lo puede necesitar recordándole que aquí estas tú como su apoyo y que esta Dios que no se cansa de mirarnos."]}, {"c": "Mateo 22, 15-21", "e": ["En aquel tiempo, se reunieron los fariseos para ver la manera de hacer caer a Jesús, con preguntas insidiosas, en algo de que pudieran acusarlo.", "Le enviaron, pues, a algunos de sus secuaces, junto con algunos del partido de Herodes, para que le dijeran: \"Maestro, sabemos que eres sincero y enseñas con verdad el camino de Dios, y que nada te arredra, porque no buscas el favor de nadie. Dinos, pues, qué piensas: ¿Es lícito o no pagar el tributo al César?\"", "Conociendo Jesús la malicia de sus intenciones, les contestó: \"Hipócritas, ¿por qué tratan de sorprenderme? Enséñenme la moneda del tributo\". Ellos le presentaron una moneda. Jesús les preguntó: \"¿De quién es esta imagen y esta inscripción?\" Le respondieron: \"Del César\". Y Jesús concluyó: \"Den, pues, al César lo que es del César, y a Dios lo que es de Dios\"."], "n": "Sabiduría", "d": "", "o": "Padre en este camino ayúdame a reconocer que no todo se te ha de atribuir, que en nuestro libre albedrio también elegimos y que todos los caminos que tomamos no son los que has esperado para que yo sufra pero que en todos los caminos podrás tu caminar conmigo. San Ignacio de Loyola, ruega por nosotros.", "r": ["Hoy tienes una cita muy especial, no olvides asistir a Eucaristía y aprovecha para pedirle perdón por las veces que lo has culpado e incluso juzgado por lo que te pasa y dile: Háblame señor que tu siervo escucha"]}, {"c": "Lucas 12, 13-21", "e": ["En aquel tiempo, hallándose Jesús en medio de una multitud, un hombre le dijo: “Maestro, dile a mi hermano que comparta conmigo la herencia”. Pero Jesús le contestó: “Amigo, ¿quién me ha puesto como juez en la distribución de herencias?”", "Y dirigiéndose a la multitud, dijo: “Eviten toda clase de avaricia, porque la vida del hombre no depende de la abundancia de los bienes que posea”.", "Después les propuso esta parábola: “Un hombre rico tuvo una gran cosecha y se puso a pensar: ‘¿Qué haré, porque no tengo ya en dónde almacenar la cosecha? Ya sé lo que voy a hacer: derribaré mis graneros y construiré otros más grandes para guardar ahí mi cosecha y todo lo que tengo. Entonces podré decirme: Ya tienes bienes acumulados para muchos años; descansa, come, bebe y date a la buena vida’. Pero Dios le dijo: ‘¡Insensato! Esta misma noche vas a morir. ¿Para quién serán todos tus bienes?’ Lo mismo le pasa al que amontona riquezas para sí mismo y no se hace rico de lo que vale ante Dios”."], "n": "Entendimiento", "d": "", "o": "Señor Jesús hoy inicio una semana más, una nueva oportunidad en la que quiero fortalecer mi entendimiento a lo que me has llamado, quiero hacerme rico de ti y de tu palabra. Ayúdame como llave a poner mis bienes y servicios en servicio de los demás, en el retiro y en las puertas que acompañaré o con las que cruzaré palabra. San Ignacio de Loyola, ruega por nosotros.", "r": ["¿Cuándo fue la última vez que paraste y compartiste realmente con alguien fuera de tu rutina? Hoy inicia tu semana buscando una persona y comparte algo con el o ella, saca un espacio pequeño (si sabes que en algo puedes ayudarle, invítale algo pequeño, llámalo/a durante unos minutos…. Recuerda que las riquezas no son solo monetarias)"]}, {"c": "Lucas 12, 35-38", "e": ["En aquel tiempo, Jesús dijo a sus discípulos: “Estén listos, con la túnica puesta y las lámparas encendidas. Sean semejantes a los criados que están esperando a que su señor regrese de la boda, para abrirle en cuanto llegue y toque. Dichosos aquellos a quienes su señor, al llegar, encuentre en vela. Yo les aseguro que se recogerá la túnica, los hará sentar a la mesa y él mismo les servirá. Y si llega a medianoche o a la madrugada y los encuentra en vela, dichosos ellos”."], "n": "Ciencia", "d": "", "o": "Padre Gracias, porque si hoy estoy en este camino me has llamado a mantener mi vela prendida, guíame a que con ayuda de cada cosa que me brindas día a día la mantenga prendida. Puedo tener miedo y cuestionamientos en este camino, pero no permitas que deje de estar en vela para ti incluso sin saber en qué momento te sentiré más o menos solo hazme paciente. Te pido por las puertas que quieren también mantenerse en vela y ayuda en especial a todas las llaves a permanecer en este camino. Ayúdanos a reconocer que al mantenernos en vela no nos has llamado a ser perfectos, que podemos errar, que siempre seremos imperfectos y que no nos exiges ser cada vez más suficientes. Ayúdame a eliminar el “suficiente” en mi solo ayúdame que dentro de mi imperfección mi vela no se apague.", "r": ["¿En que deseas soltar al menos por este día la exigencia por ser suficiente?"]}, {"c": "Lucas 12, 39-48", "e": ["En aquel tiempo, Jesús dijo a sus discípulos: “Fíjense en esto: Si un padre de familia supiera a qué hora va a venir el ladrón, estaría vigilando y no dejaría que se le metiera por un boquete en su casa. Pues también ustedes estén preparados, porque a la hora en que menos lo piensen, vendrá el Hijo del hombre”.", "Entonces Pedro le preguntó a Jesús: “¿Dices esta parábola sólo por nosotros o por todos?”", "El Señor le respondió: “Supongan que un administrador, puesto por su amo al frente de la servidumbre con el encargo de repartirles a su tiempo los alimentos, se porta con fidelidad y prudencia. Dichoso ese siervo, si el amo, a su llegada, lo encuentra cumpliendo con su deber. Yo les aseguro que lo pondrá al frente de todo lo que tiene.", "Pero si ese siervo piensa: ‘Mi amo tardará en llegar’ y empieza a maltratar a los otros siervos y siervas, a comer, a beber y a embriagarse, el día menos pensado y a la hora más inesperada llegará su amo y lo castigará severamente y le hará correr la misma suerte de los desleales.", "El siervo que conociendo la voluntad de su amo, no haya preparado ni hecho lo que debía, recibirá muchos azotes; pero el que, sin conocerla, haya hecho algo digno de castigo, recibirá pocos.", "Al que mucho se le da, se le exigirá mucho; y al que mucho se le confía, se le exigirá mucho más."], "n": "Consejo", "d": "", "o": "", "r": ["#Día primero de la novena a San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Primer día: Por una fe vivísima de vuestros divinos misterios", "Jesús mío dulcísimo, que nos revelaste los misterios sagrados de vuestra fe, y por vuestra predicación deseasteis plantarla en los corazones humanos como raíz de todas las buenas obras y de la eterna salvación; os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente los de su iluminada fe, con la cual creería cuantos misterios están escritos en las santas Escrituras, aunque se perdiesen todos los libros sagrados, y de la cual animado la defendió contra los herejes, la dilató entre los gentiles y la avivó entre los católicos. Os suplico, Padre amantísimo de mi alma, me deis una fe vivísima de vuestros divinos misterios que me ilustre para creerlos y estimarlos como verdadero hijo de la Santa Iglesia con fervorosas obras de perfecto cristiano y me concedáis la gracia que os pido en esta novena, si es para mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 12, 49-53", "e": ["En aquel tiempo, Jesús dijo a sus discípulos: “He venido a traer fuego a la tierra, ¡y cuánto desearía que ya estuviera ardiendo! Tengo que recibir un bautismo, ¡y cómo me angustio mientras llega!", "¿Piensan acaso que he venido a traer paz a la tierra? De ningún modo. No he venido a traer la paz, sino la división. De aquí en adelante, de cinco que haya en una familia, estarán divididos tres contra dos y dos contra tres. Estará dividido el padre contra el hijo, el hijo contra el padre, la madre contra la hija y la hija contra la madre, la suegra contra la nuera y la nuera contra la suegra’’."], "n": "Fortaleza", "d": "", "o": "", "r": ["#Día Segundo de la novena a San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Segundo día: Por una esperanza segura de salvarme", "Jesús mío dulcísimo, que prometisteis a vuestros siervos tendrían en vuestra esperanza todos los tesoros del mundo y nada les faltaría de cuanto esperasen confiados en vuestra liberalidad tan amorosa como infinita: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente aquella firmísima esperanza que le sirvió de tesoro inagotable en su pobreza, de áncora segura en las tormentas de tantas persecuciones, y de una gloria anticipada entre los riesgos de esta miserable vida. Os suplico, Padre amantísimo de mi alma, me concedáis una esperanza segura de salvarme, afianzada en las buenas obras hechas con vuestra gracia y revestidas de vuestros méritos y promesas; y también de conseguir los bienes de esta vida conducentes a mi eterna salvación y proporcionados a mi estado, y la gracia que os pido en esta novena, si es para mayor gloria de Dios, honor vuestro y provecho de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 12, 54-59", "e": ["En aquel tiempo, Jesús dijo a la multitud: “Cuando ustedes ven que una nube se va levantando por el poniente, enseguida dicen que va a llover, y en efecto, llueve. Cuando el viento sopla del sur, dicen que hará calor, y así sucede. ¡Hipócritas! Si saben interpretar el aspecto que tienen el cielo y la tierra, ¿por qué no interpretan entonces los signos del tiempo presente? ¿Por qué, pues, no juzgan por ustedes mismos lo que les conviene hacer ahora?", "Cuando vayas con tu adversario a presentarte ante la autoridad, haz todo lo posible por llegar a un acuerdo con él en el camino, para que no te lleve ante el juez, el juez te entregue a la policía, y la policía te meta en la cárcel. Yo te aseguro que no saldrás de ahí hasta que pagues el último centavo’’."], "n": "Piedad", "d": "", "o": "", "r": ["#Día Tercero de la novena a San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Tercer día: Por una centella de ese fuego sagrado de mi seráfico Padre San Ignacio", "Jesús mío dulcísimo, que tanto deseasteis el amor de vuestras criaturas que nos intimasteis como máximo y principal precepto amar a nuestro Dios con todo el corazón, con toda el alma y con todas las fuerzas: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente aquel inflamadísimo amor con el cual, abrasado en un serafín humano, respiraba sólo llamas de amor divino, refiriendo todas sus palabras y pensamientos a la mayor gloria de Dios y deseando por premio de su amor más y más amor, posponiendo la certeza de su eterna felicidad a la gloria de servir a Dios. Os suplico, Padre amantísimo de mi alma, me concedáis una centella de ese fuego sagrado de mi seráfico Padre San Ignacio, y la gracia que os pido en esta novena a mayor gloria de Dios, honor del Santo y provecho de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 13, 1-9", "e": ["En aquel tiempo, algunos hombres fueron a ver a Jesús y le contaron que Pilato había mandado matar a unos galileos, mientras estaban ofreciendo sus sacrificios. Jesús les hizo este comentario: “¿Piensan ustedes que aquellos galileos, porque les sucedió esto, eran más pecadores que todos los demás galileos? Ciertamente que no; y si ustedes no se arrepienten, perecerán de manera semejante. Y aquellos dieciocho que murieron aplastados por la torre de Siloé, ¿piensan acaso que eran más culpables que todos los demás habitantes de Jerusalén? Ciertamente que no; y si ustedes no se arrepienten, perecerán de manera semejante”.", "Entonces les dijo esta parábola: “Un hombre tenía una higuera plantada en su viñedo; fue a buscar higos y no los encontró. Dijo entonces al viñador: ‘Mira, durante tres años seguidos he venido a buscar higos en esta higuera y no los he encontrado. Córtala. ¿Para qué ocupa la tierra inútilmente?’ El viñador le contestó: ‘Señor, déjala todavía este año; voy a aflojar la tierra alrededor y a echarle abono, para ver si da fruto. Si no, el año que viene la cortaré’ ”."], "n": "Temor de Dios", "d": "", "o": "", "r": ["#Día Cuarto de San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Cuarto día: Por una caridad inflamada", "Jesús mío dulcísimo, que nos recomendasteis la caridad y el amor a los prójimos como el distintivo y señal de vuestra escuela, diciendo que en esto se habían de conocer vuestros discípulos: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente aquella ardentísima caridad con que deseaba encender en el fuego del divino amor a todos los hombres del mundo, y con que hizo y padeció tanto por su eterna salvación y por asistirlos en todos sus trabajos. Os suplico, Padre amantísimo de mi alma, me concedáis una caridad inflamada, con la cual, a imitación de mi Padre San Ignacio, trabaje continuamente en el bien y salvación de mis prójimos con mis palabras y ejemplos, y con cuanto necesitaren de mi caritativa asistencia, y la gracia que os pido en esta novena a mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Mateo 22, 34-40", "e": ["En aquel tiempo, habiéndose enterado los fariseos de que Jesús había dejado callados a los saduceos, se acercaron a él. Uno de ellos, que era doctor de la ley, le preguntó para ponerlo a prueba: \"Maestro, ¿cuál es el mandamiento más grande de la ley?\"", "Jesús le respondió: \"Amarás al Señor, tu Dios, con todo tu corazón, con toda tu alma y con toda tu mente. Éste es el más grande y el primero de los mandamientos. Y el segundo es semejante a éste: Amarás a tu prójimo como a ti mismo. En estos dos mandamientos se fundan toda la ley y los profetas\"."], "n": "Sabiduría", "d": "", "o": "", "r": ["#Día Quinto de San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Quinto día: Para que fortalezcáis la fragilidad de mi espíritu", "Jesús mío dulcísimo, que nos encomendasteis la paciencia en los trabajos de esta vida como la senda de la perfección y el camino real de la gloria: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente los de aquella paciencia invicta con que sufrió desprecios, calumnias, cárceles y cadenas con un espíritu tan constante y alegre en los trabajos, que decía no tener el mundo tantos grillos y cadenas como deseaba padecer por Jesús. Os suplico, Padre amantísimo de mi alma, fortalezcáis la fragilidad de mi espíritu, para que con invencible paciencia resista los trabajos, penas y angustias de esta miserable vida, pobreza, dolores y afrentas, fabricando de ellas escala para subir a la gloria, y la gracia que os pido en esta novena, si es para mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 13, 10-17", "e": ["Un sábado, estaba Jesús enseñando en una sinagoga. Había ahí una mujer que llevaba dieciocho años enferma por causa de un espíritu malo. Estaba encorvada y no podía enderezarse. Al verla, Jesús la llamó y le dijo: “Mujer, quedas libre de tu enfermedad”. Le impuso las manos y, al instante, la mujer se enderezó y empezó a alabar a Dios.", "Pero el jefe de la sinagoga, indignado de que Jesús hubiera hecho una curación en sábado, le dijo a la gente: “Hay seis días de la semana en que se puede trabajar; vengan, pues, durante esos días a que los curen y no el sábado”.", "Entonces el Señor dijo: “¡Hipócritas! ¿Acaso no desata cada uno de ustedes su buey o su burro del pesebre para llevarlo a abrevar, aunque sea sábado? Y a esta hija de Abraham, a la que Satanás tuvo atada durante dieciocho años, ¿no era bueno desatarla de esa atadura, aun en día de sábado?”", "Cuando Jesús dijo esto, sus enemigos quedaron en vergüenza; en cambio, la gente se alegraba de todas las maravillas que él hacía."], "n": "Entendimiento", "d": "", "o": "", "r": ["#Día Sexto de San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Sexto día: Por el don de la oración perfecta", "Jesús mío dulcísimo, que con el ejemplo y las palabras nos enseñasteis el continuo ejercicio de la oración y a vivir con el cuerpo en la tierra y en el cielo con el espíritu: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente los de aquella continua y perfectísima oración con que vivió entre los ángeles mientras moraba entre los hombres, para conducirlos con sus trabajos y fatigas a la patria bienaventurada. Os suplico, Padre amantísimo de mi alma, me concedáis el don de la oración perfecta en aquel grado que me conviene para mi salvación y para llevar a otros muchos a la gloria, y la gracia que os pido en esta novena, si es para mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 13, 18-21", "e": ["En aquel tiempo, Jesús dijo: “¿A qué se parece el Reino de Dios? ¿Con qué podré compararlo? Se parece a la semilla de mostaza que un hombre sembró en su huerta; creció y se convirtió en un arbusto grande y los pájaros anidaron en sus ramas”.", "Y dijo de nuevo: “¿Con qué podré comparar al Reino de Dios? Con la levadura que una mujer mezcla con tres medidas de harina y que hace fermentar toda la masa”."], "n": "Ciencia", "d": "", "o": "", "r": ["#Día séptimo de San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Séptimo día: Por una mortificación interior y exterior", "Jesús mío dulcísimo, que con las austeridades de vuestra sacratísima vida, pasión y muerte procurasteis inspirarnos una vida austera, rígida, penitente y mortificada: os ofrezco los merecimientos de mi Padre San Ignacio, y singularmente los de su espantosa penitencia, con la cual convirtió la gruta de Manresa en un abreviado mapa de los rigores de Egipto, Tebaida y Nitria, y venció todas sus pasiones hasta reducirlas a ser instrumentos de la divina gracia. Os suplico, Padre amantísimo de mi alma, me concedáis una mortificación interior y exterior tan perfecta que sujete todas mis pasiones y apetitos a la gracia, y con austeridades y penitencias de la carne, mi cuerpo obedezca a las leyes de una castidad evangélica; y la gracia que os pido en esta novena a mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 6, 12-16", "e": ["Por aquellos días, Jesús se retiró al monte a orar y se pasó la noche en oración con Dios.", "Cuando se hizo de día, llamó a sus discípulos, eligió a doce de entre ellos y les dio el nombre de apóstoles. Eran Simón, a quien llamó Pedro, y su hermano Andrés; Santiago y Juan; Felipe y Bartolomé; Mateo y Tomás; Santiago, el hijo de Alfeo, y Simón, llamado el Fanático; Judas, el hijo de Santiago, y Judas Iscariote, que fue el traidor."], "n": "Consejo", "d": "", "o": "", "r": ["#Día Octavo de San Ignacio de Loyola.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Octavo día: Por una perfectísima obediencia a todos mis superiores", "Jesús mío dulcísimo, que desde el instante de vuestra encarnación en el seno purísimo de vuestra madre Virgen, obedecisteis hasta morir obediente en la cruz: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente los de su heroica obediencia con que obedeció a todos sus superiores, especialmente al Sumo Pontífice de Roma, Vicario de Cristo en la tierra, consagrado con toda su religión, la Compañía de Jesús, con particular voto a la obediencia de la Santa Sede. Os suplico, Padre amantísimo de mi alma, me concedáis una perfectísima obediencia a todos mis superiores, continuada todos los instantes de mi vida, y perfecta en los tres grados de obedecer en cuanto a la ejecución, en cuanto a la voluntad y en cuanto al entendimiento, y la gracia que os pido en esta novena a mayor gloria de Dios, honor del Santo y bien de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 13, 31-35", "e": ["En aquel tiempo, se acercaron a Jesús unos fariseos y le dijeron: “Vete de aquí, porque Herodes quiere matarte”.", "Él les contestó: “Vayan a decirle a ese zorro que seguiré expulsando demonios y haciendo curaciones hoy y mañana, y que al tercer día terminaré mi obra. Sin embargo, hoy, mañana y pasado mañana tengo que seguir mi camino, porque no conviene que un profeta muera fuera de Jerusalén.", "¡Jerusalén, Jerusalén, que matas y apedreas a los profetas que Dios te envía! ¡Cuántas veces he querido reunir a tus hijos, como la gallina reúne a sus pollitos bajo las alas, pero tú no has querido!", "Así pues, la casa de ustedes quedará abandonada. Yo les digo que no me volverán a ver hasta el día en que digan: ‘¡Bendito el que viene en el nombre del Señor!’"], "n": "Fortaleza", "d": "", "o": "", "r": ["#Día Noveno de San Ignacio de Loyola.", "Señor aquí te entrego totalmente mi servicio en los próximos 3 días, hazme un instrumento tuyo, pon en tus las palabras, actos, tu mirada y tu amor. Gracias, señor por permitirme hoy iniciar este servicio, este encuentro contigo.", "#Acto de contrición", "¡Señor mío, Jesucristo!\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío; por ser Vos quien sois, Bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón de haberos ofendido;\ntambién me pesa porque podéis castigarme con las penas del infierno.\nAyudado de vuestra divina gracia\npropongo firmemente nunca más pecar, confesarme y cumplir la penitencia que me fuere impuesta.\nAmén.", "#Oración para todos los días", "Gloriosísimo Padre y Patriarca San Ignacio, fundador de la Compañía de Jesús y Padre amantísimo: si es para mayor gloria de Dios, honor vuestro y provecho de mi alma que yo consiga la gracia que os pido en esta novena, alcanzadla del Señor; y si no, ordenad mi petición con todos mis pensamientos, palabras y obras a lo que fue siempre el blasón de vuestras heroicas empresas: a mayor gloria de Dios.", "#Noveno día: Por una sólida y cordial devoción para con María Santísima", "Jesús mío dulcísimo, que al morir nos mostrasteis el amor y deseo ardiente que teníais de que los hombres todos amasen, reverenciasen y sirviesen a vuestra Santísima Madre, encomendándola al Discípulo Amado: os ofrezco los merecimientos de mi glorioso Padre San Ignacio, y singularmente los que atesoró con la cordialísima devoción que profesaba a María Santísima, a quien escogió por Madre desde su conversión; y después esta Señora hizo oficio de madre amorosa en todas las empresas que para mayor gloria vuestra emprendió el Santo, iluminándole para que escribiese el libro admirable de los Ejercicios y el de las Constituciones y Reglas de la Compañía. Os suplico, Padre amantísimo de mi alma, me concedáis una sólida y cordial devoción para con María Santísima, vuestra Madre, aquella devoción que es señal cierta de predestinados; que yo sirva a esta Señora con los obsequios del más fiel y obediente hijo, y la gracia que os pido en esta novena a mayor gloria de Dios, honor del Santo y provecho de mi alma. Amén.", "#Tres Padrenuestros y Avemarías", "#Oración final", "Oh Dios, que para propagar la mayor gloria de tu nombre, has fortalecido por medio de San Ignacio a la Iglesia militante con un nuevo auxilio: alcánzanos que con su ayuda y a imitación suya peleemos en la tierra hasta conseguir ser coronados con él en el cielo. Por Cristo nuestro Señor. Amén."]}, {"c": "Lucas 14, 1-6", "e": ["Un sábado, Jesús fue a comer en casa de uno de los jefes de los fariseos, y éstos estaban espiándolo. Había allí, frente a él, un enfermo de hidropesía, y Jesús, dirigiéndose a los escribas y fariseos, les preguntó: “¿Está permitido curar en sábado o no?”", "Ellos se quedaron callados. Entonces Jesús tocó con la mano al enfermo, lo curó y le dijo que se fuera. Y dirigiéndose a ellos les preguntó: “Si a alguno de ustedes se le cae en un pozo su burro o su buey, ¿no lo saca enseguida, aunque sea sábado?” Y ellos no supieron qué contestarle"], "n": "Temor de Dios", "d": "", "o": "", "r": ["Hoy termina nuestro camino de preparación. Llega con el corazón abierto a la Misa de inicio del retiro y pon todo en manos de Dios. Cuéntanos: ¿con qué actitud entras hoy a este servicio?"]}];

const $=s=>document.querySelector(s);

function welcome(first){
 scrollTo(0,0);
 $("#app").innerHTML=`${first?"":'<button class="lnk" onclick="home()">← Calendario</button>'}
 <header style="text-align:center;padding:8px 0"><div style="font-size:34px">☁️🔑☁️</div><h1 style="font-size:28px;margin:6px 0">30 días preparando mi corazón como Llave</h1>
 <p style="margin:0"><b>Parroquia Santa Inés de Guaymaral</b></p><p class="hn">Señor, te entrego mi servicio. Pon un poquito de miel en mi oración para no dejarla.</p></header>
 <div class="card"><label for="nin"><b>¿Cómo te llamas?</b></label><input id="nin" maxlength="40" value="${esc(st.name||"")}" placeholder="Escribe tu nombre" oninput="uq()"><p id="er" hidden style="color:#c0392b;margin:6px 0 0">Escribe tu nombre para continuar.</p></div>

 <p><b>Querida Llave<span id="qnm"></span>, gracias por dar tu SÍ ❤️‍🔥</b><br>Estos 30 días afinamos nuestros dones, para acompañar a las Puertas que están a la espera de este maravilloso encuentro.</p>
 <p>1. 🚪 Cada día tiene una puerta que podemos abrir porque en este camino nos preparamos para un servicio al que Dios nos ha llamado.<br>2. 🔑 Usa la llave para abrirla y leer el Evangelio, la Palabra que Dios quiere que escuchemos cada día.<br>3. 🕊️ El símbolo del Espíritu Santo te quiere hacer una invitación día a día con un reto o una pregunta.<br>4. ✍️ Responde y recibe una llave como agradecimiento por haber aceptado esta hermosa misión ${MED("s")}</p>
 <p>Cada día fortalecemos un don del Espíritu Santo (uno por día de la semana) y por supuesto que será también con ayuda de aquello que San Ignacio de Loyola nos ha mencionado como ejercicios espirituales: oración, imaginación, memoria, afectos, discernimiento y examen.</p>
 <p>Se abrirá únicamente el día en el que estemos y puedes revisar los anteriores. Del 21 al 29 rezamos la novena a San Ignacio de Loyola para encomendar nuestro retiro a su intercesión (casillas punteadas).</p>
 <p style="margin-bottom:0">Este camino de preparación termina el <b>30 de octubre</b> con la <b>Misa de inicio de nuestro retiro</b>. ⛪</p></div>
 <div class="card"><h2>Dones de la semana</h2><p style="margin:0">${[1,2,3,4,5,6,0].map(d=>`${DIAS[d]} — <b>${SEM[d]}</b>`).join("<br>")}</p></div>
 <div class="card">${NOTA}</div>
 <button class="btn" onclick="go()">${first?"Comenzar el reto":"Volver al calendario"}</button>`;
 uq();
}

 <header style="text-align:center"><h1 style="font-size:20px;margin:0">30 días preparando mi corazón como Llave</h1><p class="mut" style="margin:2px 0 0;font-size:14px">${esc(st.name||"")} · Parroquia Santa Inés de Guaymaral</p></header>

 <div class="card"><h2>Mi consolidado</h2><p class="mut" style="margin-top:0">Reúne todo lo que has escrito. Al terminar el reto podrás descargarlo completo.</p><button class="btn2" style="width:100%" onclick="cons()">Ver y descargar mi consolidado</button></div>

 const X=DOC[i],cur=i==T,dn=st.done[i];

 const nv=i>=20&&i<29,open=!cur||st.op[i]||dn,rd=!cur||st.rd[i]||dn,ds=X.d||DON[X.n]||"";
 const gos=X.e.map(p=>`<p>${esc(p)}</p>`).join("");
 let h=`<button class="lnk" onclick="home()">← Calendario</button>
 <header style="text-align:center"><button onclick="info(${i})" aria-label="Ver progreso y detalles"><h1 style="font-size:28px;border-bottom:2px dotted var(--ac);margin:0">${nm(i)} ▾</h1></button>
 <p style="margin:8px 0 2px"><b>Don de ${X.n}</b></p><p class="mut" style="margin:0;font-size:15px">${esc(ds)}</p>
 <p class="mut" style="margin:6px 0 0">Día ${i+1} de 30${nv?` · <span class="tag">Novena ${i-19} de 9</span>`:""}</p></header>
 <div class="door ${rd?"s":open?"o":""}">${PH}</div>`;
 if(!rd){
  if(cur&&!open)h+=`<button class="btn" onclick="st.op[${i}]=1;sv();day(${i})">🔑 Abrir la puerta</button><p class="mut" style="text-align:center">Toca la llave para leer el Evangelio de hoy.</p>`;
  if(open)h+=`<div class="card"><h3>Evangelio del día</h3><p style="font-size:19px;margin:6px 0"><b>${esc(X.c)}</b></p>${gos}</div><button class="btn" onclick="st.rd[${i}]=1;sv();day(${i})">🕊️ Terminé la lectura</button>`;
 }else{
  h+=`<div class="card"><h3>Reto / Pregunta del día</h3>${X.r.map(r=>r[0]=="#"?`<h3>${esc(r.slice(1))}</h3>`:`<p style="white-space:pre-line">${esc(r)}</p>`).join("")}</div>`;
  if(X.o)h+=`<div class="card"><h3>Oración</h3><p style="font-family:Georgia,serif;margin:0">${esc(X.o)}</p></div>`;
  if(dn)h+=`<div class="card" style="text-align:center"><div class="pop">${MED()}</div><h3 style="margin-top:14px">¡Medalla ganada!</h3><p class="mut" style="white-space:pre-line">«${esc(dn.t)}»</p></div>`;
  else if(cur)h+=`<div class="card"><h3>Tu respuesta</h3><p style="margin:0">Escribe tu respuesta a la pregunta o cuéntanos cómo viviste el reto de hoy.</p><textarea id="ans" rows="4" placeholder="Escribe aquí (queda guardado solo en tu dispositivo)" oninput="(st.dr=st.dr||{})[${i}]=this.value;sv()">${esc((st.dr&&st.dr[i])||"")}</textarea><p id="er" hidden style="color:#c0392b">Escribe unas palabras para recibir tu medalla.</p><button class="btn" onclick="fin(${i})">Guardar y recibir medalla</button></div>`;
  else h+=`<div class="card mut">Este día no quedó completado. ${NOTA2}</div>`;
  h+=`<div class="card"><h3>Conoce a San Ignacio</h3><p style="margin:0">${IG[i]}</p></div><details class="card"><summary>Evangelio del día · ${esc(X.c)}</summary>${gos}</details>`}
 $("#app").innerHTML=h+`<div class="card"><h3>Oraciones</h3>${PB()}</div>`;
}

function cons(){
 scrollTo(0,0);
 const ds=Object.keys(st.done).map(Number).sort((a,b)=>a-b);
 $("#app").innerHTML=`<button class="lnk noprint" onclick="home()">← Calendario</button><h1 style="font-size:26px;margin:6px 0 0">Mi consolidado</h1><p class="mut" style="margin:0 0 8px">${esc(st.name||"")} · ${ds.length} de 29 respuestas</p>`+
 (ds.length?ds.map(i=>`<div class="card"><h3>Día ${i+1} · ${nm(i)}</h3><p class="mut" style="margin:0 0 6px">Don de ${DOC[i].n}</p><p style="margin:0 0 6px"><b>${i<20?"Reto / Pregunta:</b> "+esc(DOC[i].r[0]):"Novena a San Ignacio · día "+(i-19)+" de 9</b>"}</p><p style="white-space:pre-line;margin:0"><b>Mi respuesta:</b> ${esc(st.done[i].t)}</p></div>`).join(""):`<div class="card">Aún no tienes respuestas guardadas. Cuando respondas cada día, aparecerán aquí.</div>`)+
 `<button class="btn" onclick="dl()">Descargar mi consolidado</button><button class="btn2" style="width:100%" onclick="window.print()">Guardar como PDF / imprimir</button>`;
}
function dl(){
 const L=["30 DÍAS PREPARANDO MI CORAZÓN COMO LLAVE","Parroquia Santa Inés de Guaymaral","",st.name||"","Consolidado de mis respuestas","",""];
 Object.keys(st.done).map(Number).sort((a,b)=>a-b).forEach(i=>{
  L.push("DÍA "+(i+1)+" · "+nm(i)+" · Don de "+DOC[i].n);
  L.push(i<20?"Reto / Pregunta: "+DOC[i].r[0]:"Novena a San Ignacio · día "+(i-19)+" de 9");
  L.push("Mi respuesta: "+st.done[i].t,"")});
 L.push("Gracias por aceptar ser Llave del CIELO.");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/plain;charset=utf-8"}));
 a.download="Mi consolidado - 30 dias preparando mi corazon.txt";document.body.appendChild(a);a.click();a.remove()}
function fin(i){const v=$("#ans").value.trim();if(v.length<3){$("#er").hidden=false;return}st.done[i]={t:v,ts:Date.now()};sv();day(i)}
function info(i){const X=DOC[i],n=cnt();
 $("#dlg").innerHTML=`<h2>${nm(i)}</h2><p><b>Don de ${X.n}:</b> ${esc(X.d||DON[X.n]||"")}</p>
 <p><b>Tu progreso:</b> ${n} de 29 medallas ${MED("s")}</p><div class="bar"><i style="width:${n/29*100}%"></i></div>
 <p>Este camino termina el <b>30 de octubre</b> con la Misa de inicio del retiro.</p><p class="mut">${NOTA2}</p>
 <button class="btn" onclick="$('#dlg').close()">Cerrar</button>`;$("#dlg").showModal()}
st.name?home():welcome(1);

</script></body></html>
